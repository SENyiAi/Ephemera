<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)" />
  
  <!-- Cloud icon -->
  <g transform="translate(24, 40)">
    <!-- Main cloud body -->
    <path d="M 20 25 Q 20 15, 30 15 Q 35 10, 45 10 Q 55 10, 60 15 Q 70 15, 70 25 Q 70 35, 60 35 L 30 35 Q 20 35, 20 25 Z" 
          fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Server lines -->
    <rect x="30" y="20" width="30" height="3" fill="#667EEA" rx="1"/>
    <rect x="30" y="26" width="30" height="3" fill="#667EEA" rx="1"/>
    <rect x="30" y="32" width="20" height="3" fill="#667EEA" rx="1"/>
    
    <!-- Connection dots -->
    <circle cx="25" cy="21" r="2" fill="#FFFFFF"/>
    <circle cx="65" cy="21" r="2" fill="#FFFFFF"/>
    <circle cx="25" cy="33" r="2" fill="#FFFFFF"/>
    <circle cx="65" cy="33" r="2" fill="#FFFFFF"/>
  </g>
  
  <!-- "E" letter -->
  <text x="64" y="95" font-family="Arial, sans-serif" font-size="32" font-weight="bold" 
        fill="#FFFFFF" text-anchor="middle">E</text>
</svg>
